<!DOCTYPE html>
<html>

<head>

<title>Issue Book</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
{% load static %}
        <link rel="stylesheet" href="/static/library/style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
            📚 Library Management
        </a>
        <div>
            <a href="{% url 'dashboard' %}" class="btn btn-light me-2">
                Dashboard
            </a>

            <a href="{% url 'home' %}" class="btn btn-light me-2">
                Books
            </a>

            <a href="{% url 'students' %}" class="btn btn-light me-2">
                Students
            </a>

            <a href="{% url 'issue_book' %}" class="btn btn-light me-2">
                Issue
            </a>

            <a href="{% url 'transactions' %}" class="btn btn-light me-2">
                Transactions
            </a>
            <a href="{% url 'logout' %}" class="btn btn-danger">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        📚 Issue Book
                    </h4>

                </div>

                <div class="card-body">

                    {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">
                                Student
                            </label>

                            <select name="student" class="form-select">

                                {% for student in students %}
                                    <option value="{{ student.id }}">
                                        {{ student.name }}
                                    </option>
                                {% endfor %}

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Book
                            </label>

                            <select name="book" class="form-select">

                                {% for book in books %}
                                    <option value="{{ book.id }}">
                                        {{ book.title }}
                                    </option>
                                {% endfor %}

                            </select>

                        </div>

                        <button class="btn btn-success">

                            Issue Book

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
<hr>

<center>

Library Management System

Developed by Sumit

</center>
</body>

</html>
