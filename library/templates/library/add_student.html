<!DOCTYPE html>
<html>

<head>

<title>Add Student</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
{% load static %}
        <link rel="stylesheet" href="/static/library/style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
            📚 Library Management
        </a>
        <div>
            <a href="{% url 'dashboard' %}" class="btn btn-light me-2">
                Dashboard
            </a>

            <a href="{% url 'home' %}" class="btn btn-light me-2">
                Books
            </a>

            <a href="{% url 'students' %}" class="btn btn-light me-2">
                Students
            </a>

            <a href="{% url 'issue_book' %}" class="btn btn-light me-2">
                Issue
            </a>

            <a href="{% url 'transactions' %}" class="btn btn-light me-2">
                Transactions
            </a>
            <a href="{% url 'logout' %}" class="btn btn-danger">
                Logout
            </a>
        </div>
    </div>
</nav>
<h1>Add Student</h1>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        Add Student
                    </h4>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            {{ form.name }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            {{ form.email }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            {{ form.phone }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Department
                            </label>

                            {{ form.department }}

                        </div>

                        <button class="btn btn-success">

                            Save Student

                        </button>

                        <a href="{% url 'students' %}" class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<footer class="text-center mt-5 mb-3 text-muted">

    <hr>

    Library Management System © 2026

    <br>

    Developed by <b>Praveen</b>

</footer>
</body>

</html>
